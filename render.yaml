services:
  - type: web
    name: knowmap-ai-deploy
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120

    envVars:
      - key: ENABLE_AI_MODELS
        value: "false"

      - key: FLASK_DEBUG
        value: "false"

      - key: PYTHON_VERSION
        value: "3.11.11"

      - key: SECRET_KEY
        generateValue: true